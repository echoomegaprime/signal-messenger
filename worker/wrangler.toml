name = "signal-messenger"
main = "src/index.js"
compatibility_date = "2024-12-01"
workers_dev = true

# Custom domain
routes = [
  { pattern = "whisper.echo-op.com/*", zone_name = "echo-op.com" }
]

[[d1_databases]]
binding = "DB"
database_name = "signal-messenger-db"
database_id = "71172712-ee0b-44b7-99bc-fe6963662382"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "signal-messenger-media"

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "ChatRoom" }
]

[[migrations]]
tag = "v1"
new_classes = ["ChatRoom"]

[vars]
ENVIRONMENT = "production"
